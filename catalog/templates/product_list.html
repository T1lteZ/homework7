{% extends "home.html" %}
{% block content %}
{% load my_tags %}
{% load static %}
<div class="container">
        <div class="row text-center">
            {% for product in products %}
            <div class="col-3">
                <div class="card mb-4 box-shadow">
                    <div class="card-header">
                        <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
                    </div>
                    <div class="card-body">
                        <img src="{{ product.image | media_filter }}" class="card-img-top" alt="{{ product.name }}">
                        <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                            <li>- {{ product.description|slice:":100" }}{% if product.description|length > 100 %}...{% endif %}</li>
                        </ul>
                        <a type="button" class="btn btn-lg btn-block btn-outline-primary" href="{% url 'catalog:product' pk=product.pk %}">Купить за {{ product.price }}</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
